<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145c3b">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3;url=https://sistema-keneddy.onrender.com/">
  <title>SGVE | Colégio Estadual Presidente Kennedy</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#183b2a;background:#f2f6f2}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);padding:32px;border:1px solid #dce8dd;border-radius:18px;background:#fff;box-shadow:0 18px 50px #173b2814;text-align:center}
    .mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:#145c3b;color:#fff;font-weight:900;letter-spacing:1px}
    h1{margin:22px 0 8px;font-size:25px}
    p{color:#617367;line-height:1.6}
    a{display:inline-block;margin-top:12px;padding:13px 20px;border-radius:10px;background:#145c3b;color:#fff;text-decoration:none;font-weight:700}
    small{display:block;margin-top:18px;color:#849187}
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-label="CEPK">CEPK</span>
    <h1>SGVE · Colégio Estadual Presidente Kennedy</h1>
    <p>A versão demonstrativa com dados fictícios foi retirada. O sistema de trabalho está sendo concentrado na aplicação com autenticação e banco de dados no servidor.</p>
    <a href="https://sistema-keneddy.onrender.com/">Abrir o SGVE</a>
    <small>Você será encaminhado automaticamente em alguns segundos.</small>
  </main>
  <script>
    (async () => {
      try {
        const registrations = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(registrations.map(registration => registration.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('sgve-cepk-')).map(key => caches.delete(key)));
        }
      } catch (_) {}
      setTimeout(() => location.replace('https://sistema-keneddy.onrender.com/'), 1800);
    })();
  </script>
</body>
</html>
