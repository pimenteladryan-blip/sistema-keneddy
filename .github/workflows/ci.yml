name: SGVE - verificações

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install
      - name: Verificar sintaxe
        run: npm run check
      - name: Executar testes
        run: npm test
