services:
  - type: web
    name: sgve-colegio-kennedy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/sgve.sqlite
      - key: ADMIN_NAME
        value: Administrador do SGVE
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: sgve-data
      mountPath: /var/data
      sizeGB: 1
