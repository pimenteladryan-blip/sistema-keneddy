<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2200" viewBox="0 0 1080 2200">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#07142f"/><stop offset="1" stop-color="#020a1d"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#123f83"/><stop offset="1" stop-color="#071d49"/></linearGradient>
