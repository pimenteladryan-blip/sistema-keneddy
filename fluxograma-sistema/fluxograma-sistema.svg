<rect x="830" y="1985" width="210" height="82" rx="16" fill="url(#green)" stroke="#6cff9f" stroke-width="3"/>
<text x="935" y="2035" text-anchor="middle" class="ct">LOGOUT</text>
<path class="line" d="M935 2067V2120"/>
<rect x="840" y="2120" width="190" height="58" rx="28" fill="url(#green)" stroke="#6cff9f" stroke-width="3"/><text x="935" y="2158" text-anchor="middle" class="ct">FIM</text>
<path d="M390 2025H35V310H280" stroke="#42baff" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#arr)"/>
<text x="55" y="2000" class="sm">NÃO: continuar no menu</text>
<text x="540" y="2188" text-anchor="middle" class="sm">Símbolos: oval = início/fim · retângulo = processo · losango = decisão · seta = fluxo</text>
