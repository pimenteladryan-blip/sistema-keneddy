 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#d8edff"/></marker>
 <style>
 .h{font: bold 36px Arial;fill:#fff}.sub{font:22px Arial;fill:#c7e5ff}.ct{font:bold 23px Arial;fill:#fff}.tx{font:18px Arial;fill:#e6f3ff}.sm{font:16px Arial;fill:#b9d8f5}.line{stroke:#d8edff;stroke-width:4;fill:none;marker-end:url(#arr)}.card{fill:url(#blue);stroke:#42baff;stroke-width:3}.decision{fill:#092958;stroke:#48c5ff;stroke-width:4}
 </style>
</defs>
<rect width="1080" height="2200" fill="url(#bg)"/>
<path d="M0 0H300L180 110H0Z M1080 0H850L970 110H1080Z" fill="#0754b8" opacity=".8"/>
<path d="M0 0H220L145 65H0Z M1080 0H900L965 65H1080Z" fill="#12b96a"/>
<text x="540" y="82" text-anchor="middle" class="h" font-size="48">SGVE | FLUXOGRAMA COMPLETO</text>
<text x="540" y="122" text-anchor="middle" class="sub">Sistema de Gerenciamento de Viagens Escolares · CEPK</text>
<rect x="420" y="155" width="240" height="64" rx="32" fill="url(#green)" stroke="#6cff9f" stroke-width="3"/>
<text x="540" y="197" text-anchor="middle" class="ct">INÍCIO</text>
<path class="line" d="M540 219V260"/>
<rect x="280" y="260" width="520" height="100" rx="18" class="card"/>
<text x="540" y="300" text-anchor="middle" class="ct">TELA DE ACESSO</text><text x="540" y="333" text-anchor="middle" class="tx">Selecionar perfil · informar e-mail e senha</text>
<path class="line" d="M420 360V405H260V445 M660 360V405H820V445"/>
<rect x="100" y="445" width="320" height="78" rx="16" class="card"/><text x="260" y="478" text-anchor="middle" class="ct">Entrar com e-mail e senha</text><text x="260" y="505" text-anchor="middle" class="sm">Firebase Authentication</text>
<rect x="660" y="445" width="320" height="78" rx="16" class="card"/><text x="820" y="478" text-anchor="middle" class="ct">Entrar com Google</text><text x="820" y="505" text-anchor="middle" class="sm">Conta Google verificada</text>
<path class="line" d="M260 523V555H540V585 M820 523V555H540"/>
<polygon points="540,585 700,665 540,745 380,665" class="decision"/>
<text x="540" y="650" text-anchor="middle" class="ct">Acesso válido?</text><text x="540" y="680" text-anchor="middle" class="tx">E-mail verificado, conta ativa</text><text x="540" y="708" text-anchor="middle" class="tx">e perfil autorizado?</text>
<path class="line" d="M700 665H890V720"/><text x="770" y="645" class="ct" fill="#ff6b7c">NÃO</text>
<rect x="790" y="720" width="250" height="90" rx="16" class="card"/><text x="915" y="755" text-anchor="middle" class="ct">Exibir erro</text><text x="915" y="784" text-anchor="middle" class="tx">Corrigir dados / tentar novamente</text>
<path class="line" d="M915 720V400H800V310"/>
<path class="line" d="M540 745V800"/><text x="560" y="780" class="ct" fill="#53f58d">SIM</text>
<rect x="300" y="800" width="480" height="82" rx="16" class="card"/><text x="540" y="835" text-anchor="middle" class="ct">Abrir painel conforme permissões do perfil</text><text x="540" y="862" text-anchor="middle" class="sm">Administrador · Direção · Secretaria · Professor · Responsável · Estudante</text>
<path class="line" d="M540 882V925"/>
<rect x="95" y="925" width="890" height="64" rx="16" fill="#073a80" stroke="#31aaff" stroke-width="3"/><text x="540" y="967" text-anchor="middle" class="h" font-size="30">MENU PRINCIPAL</text>
<text x="540" y="1025" text-anchor="middle" class="sm">O usuário acessa somente os módulos permitidos para seu perfil</text>
<path class="line" d="M540 989V1035H160V1070 M540 1035V1070 M540 1035H920V1070"/>
<rect x="45" y="1070" width="330" height="225" rx="16" class="card"/>
<text x="210" y="1110" text-anchor="middle" class="ct">TURMAS</text>
<text x="70" y="1150" class="tx">• Cadastrar e consultar turmas</text><text x="70" y="1182" class="tx">• Ensino Fundamental ou Médio</text><text x="70" y="1214" class="tx">• Série/ano e curso</text><text x="70" y="1246" class="tx">• Regular, Técnico ADM ou DS</text><text x="70" y="1278" class="tx">• Turma e ano letivo</text>
<rect x="395" y="1070" width="290" height="225" rx="16" class="card"/>
<text x="540" y="1110" text-anchor="middle" class="ct">ESTUDANTES</text>
<text x="420" y="1150" class="tx">• Cadastrar estudante</text><text x="420" y="1182" class="tx">• Vincular à turma</text><text x="420" y="1214" class="tx">• Vincular conta de acesso</text><text x="420" y="1246" class="tx">• Associar responsável</text><text x="420" y="1278" class="tx">• Informar parentesco</text>
<rect x="705" y="1070" width="330" height="225" rx="16" class="card"/>
<text x="870" y="1110" text-anchor="middle" class="ct">PROFESSORES</text>
<text x="730" y="1150" class="tx">• Cadastrar professor</text><text x="730" y="1182" class="tx">• Registrar disciplinas</text><text x="730" y="1214" class="tx">• Consultar lista docente</text><text x="730" y="1246" class="tx">• Conta de acesso separada</text><text x="730" y="1278" class="sm">A conta é criada no módulo Contas</text>
<path class="line" d="M210 1295V1330H540V1360 M540 1295V1360 M870 1295V1330H540"/>
<rect x="45" y="1360" width="480" height="290" rx="16" class="card"/>
<text x="285" y="1400" text-anchor="middle" class="ct">VIAGENS ESCOLARES</text>
<text x="75" y="1440" class="tx">• Criar rascunho: título, destino e objetivo pedagógico</text><text x="75" y="1474" class="tx">• Definir data/hora de saída e retorno e capacidade</text><text x="75" y="1508" class="tx">• Vincular turmas, estudantes, professores e veículo</text><text x="75" y="1542" class="tx">• Responsável autoriza ou não a participação</text><text x="75" y="1576" class="tx">• Registrar presença na saída e no retorno</text><text x="75" y="1610" class="tx">• Consultar histórico das decisões</text>
<rect x="555" y="1360" width="480" height="290" rx="16" class="card"/>
<text x="795" y="1400" text-anchor="middle" class="ct">TRANSPORTES E FROTA</text>
<text x="585" y="1440" class="tx">• Cadastrar ônibus, micro-ônibus ou van</text><text x="585" y="1474" class="tx">• Informar identificação e capacidade</text><text x="585" y="1508" class="tx">• Cadastrar condutores</text><text x="585" y="1542" class="tx">• Atribuir veículo e condutor à viagem</text><text x="585" y="1576" class="tx">• Verificar conflitos de horário</text><text x="585" y="1610" class="tx">• Impedir veículo com capacidade insuficiente</text>
<path class="line" d="M285 1650V1680H540V1710 M795 1650V1680H540"/>
<rect x="45" y="1710" width="480" height="205" rx="16" class="card"/>
<text x="285" y="1750" text-anchor="middle" class="ct">RELATÓRIOS</text>
<text x="75" y="1790" class="tx">• Indicadores de viagens, estudantes e veículos</text><text x="75" y="1824" class="tx">• Participações, autorizações e pendências</text><text x="75" y="1858" class="tx">• Resumo operacional por viagem</text><text x="75" y="1892" class="tx">• Exportar CSV sem nomes de estudantes</text>
<rect x="555" y="1710" width="480" height="205" rx="16" class="card"/>
<text x="795" y="1750" text-anchor="middle" class="ct">RESPONSÁVEIS E CONTAS</text>
<text x="585" y="1790" class="tx">• Cadastrar responsável e conta de acesso</text><text x="585" y="1824" class="tx">• Vincular responsável ao estudante</text><text x="585" y="1858" class="tx">• Criar contas por e-mail, perfil e senha</text><text x="585" y="1892" class="tx">• Analisar solicitações: aprovar ou rejeitar</text>
<path class="line" d="M540 1915V1950"/>
<polygon points="540,1950 690,2025 540,2100 390,2025" class="decision"/>
<text x="540" y="2018" text-anchor="middle" class="ct">Deseja sair?</text><text x="540" y="2048" text-anchor="middle" class="tx">Encerrar sessão?</text>
